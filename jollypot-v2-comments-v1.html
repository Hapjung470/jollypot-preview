<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>댓글 — 졸리팟</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --color-brand: #FDB813;
    --color-primary: #FC642D;
    --color-secondary: #145F48;
    --color-bg: #FFFFFF;
    --color-surface: #FFF5EA;
    --color-surface-alt: #FFEEDC;
    --color-surface-info: #F1F8F3;
    --color-text-primary: #212121;
    --color-text-secondary: #666666;
    --color-text-tertiary: #9E9E9E;
    --color-border: #CCCFD4;
    --color-divider: #E5E7EB;
    --color-info: #3276AE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-gutter: stable; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.3px; word-break: keep-all;
    background: var(--color-bg); color: var(--color-text-primary);
    max-width: 390px; margin: 0 auto;
    padding-bottom: 76px; overflow-x: hidden;
  }

  /* ===== 헤더 ===== */
  .c-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    height: 48px; padding: 0 16px;
    background: var(--color-bg); border-bottom: 1px solid var(--color-divider);
  }
  .c-back { width: 24px; height: 24px; color: var(--color-text-primary); cursor: pointer; flex-shrink: 0; }
  .c-title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; margin-right: 24px; }

  /* ===== 정렬 ===== */
  .c-sort { display: flex; justify-content: flex-end; gap: 14px; padding: 12px 16px 4px; }
  .c-sort button {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 13px; letter-spacing: -0.3px;
    color: var(--color-text-tertiary); font-weight: 500;
  }
  .c-sort button.on { color: var(--color-text-primary); font-weight: 700; }

  /* ===== 댓글 카드 (레시피 상세와 동일 문법) ===== */
  .c-list { padding: 0 16px; }
  .cmt { display: flex; gap: 10px; padding: 11px 0; }
  .cmt.reply { padding-left: 38px; }
  .cmt-av {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--color-surface-alt);
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: var(--color-text-secondary);
    flex-shrink: 0; margin-top: 1px;
  }
  .cmt-body { flex: 1; min-width: 0; }
  .cmt-head { display: flex; align-items: center; gap: 5px; }
  .cmt-name { font-size: 13px; font-weight: 600; }
  .cmt-badge {
    font-size: 10px; font-weight: 600; color: var(--color-secondary);
    background: var(--color-surface-info); border-radius: 4px; padding: 1px 5px;
  }
  .cmt-date { font-size: 11.5px; color: var(--color-text-tertiary); }
  .cmt-more { width: 16px; height: 16px; color: var(--color-text-tertiary); flex-shrink: 0; cursor: pointer; }
  .cmt-text { font-size: 13.5px; line-height: 1.5; margin-top: 3px; }
  .cmt-mention { color: var(--color-info); font-weight: 600; }
  .cmt-acts { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
  .cmt-act {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 11.5px; color: var(--color-text-tertiary); letter-spacing: -0.3px;
  }
  .cmt-act svg { width: 14px; height: 14px; }
  .cmt-act i { font-style: normal; }
  .cmt-act.on { color: var(--color-primary); }
  .cmt-act.on svg { fill: var(--color-primary); stroke: var(--color-primary); }
  .cmt-more-reply {
    font-size: 12px; font-weight: 600; color: var(--color-text-secondary);
    padding: 2px 0 6px 38px; cursor: pointer;
  }
  .c-divider { height: 1px; background: var(--color-divider); margin: 4px 0; }

  /* ===== 하단 고정 입력 ===== */
  .c-write {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--color-bg); border-top: 1px solid var(--color-divider);
  }
  .c-write-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--color-surface); border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--color-text-tertiary); flex-shrink: 0;
  }
  .c-write-field {
    flex: 1; height: 38px; border-radius: 19px; background: #F7F8F9;
    display: flex; align-items: center; padding: 0 14px;
    font-size: 13px; color: var(--color-text-tertiary); cursor: text;
  }

  /* ===== 프로토 배지 ===== */
  .proto-badge {
    background: #1A1A2E; color: #fff; font-size: 12px;
    padding: 8px 16px; text-align: center;
  }
  .proto-badge b { color: #FDB813; }
</style>
</head>
<body>

<div class="proto-badge">프로토타입 · <b>댓글 전체 페이지</b> · jollypot-v2-comments-v1</div>

<div class="c-header">
  <svg class="c-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="history.back()">
    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  </svg>
  <span class="c-title" id="cTitle">댓글 86</span>
</div>

<div class="c-sort">
  <button id="sortNew" class="on" onclick="setSort('new')">최신순</button>
  <button id="sortHot" onclick="setSort('hot')">인기순</button>
</div>

<div class="c-list" id="cList"></div>

<div class="c-write">
  <div class="c-write-avatar">나</div>
  <div class="c-write-field">댓글 남기기</div>
</div>

<script>
/* 레시피 상세(.cmt* )와 완전히 같은 카드 문법을 쓴다 — 같은 컴포넌트로 구현할 것 */
var CMT_THUMB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.4 10.7 11.7 3a2.5 2.5 0 0 1 2.4 2.5v4.3h4.2a2.2 2.2 0 0 1 2.17 2.56l-1.05 6.1a2.2 2.2 0 0 1-2.17 1.84H7.4z"/><rect x="3.3" y="10.7" width="4.1" height="9.5" rx="1.4"/></svg>';
var CMT_REPLY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>';
var CMT_DOTS  = '<svg class="cmt-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>';

/* 전체 페이지의 대댓 노출 상한 — 상세(1개)보다 넉넉하게 2개, 넘으면 "답글 N개 더보기" */
var REPLY_MAX_FULL = 2;

var COMMENTS = [
  { u:'후추선장', d:'08.21', t:'생크림 대신 마스카포네 쓰면 더 진한 맛이 나요!', l:12, r:[
      { u:'김셰프의 간단요리', d:'08.21', t:'@후추선장 오 그 조합 좋네요, 다음에 해볼게요', author:true, l:3 },
      { u:'베이킹초보', d:'08.22', t:'저도 마스카포네로 했는데 훨씬 고소했어요', l:1 },
      { u:'디저트연구소', d:'08.22', t:'마스카포네는 좀 묽어서 냉장 시간을 늘리는 게 좋아요', l:2 } ] },
  { u:'신부감성', d:'08.19', t:'혹시 식용유 없으면 버터로 대체해도 될까요?', l:3, r:[
      { u:'김셰프의 간단요리', d:'08.19', t:'@신부감성 네, 녹인 버터로 같은 양 쓰시면 돼요', author:true, l:5 } ] },
  { u:'세아맘', d:'08.17', t:'아이가 너무 좋아해서 이번 주에만 두 번 만들었어요', l:8 },
  { u:'주말요리사', d:'08.15', t:'냉장고에 1시간이면 진짜 굳나요? 저는 불안해서 2시간 뒀는데 딱 좋았어요', l:2 },
  { u:'키위덕후', d:'08.14', t:'키위 대신 딸기로도 해봤는데 이것도 맛있어요', l:6 },
  { u:'초보주부9년차', d:'08.12', t:'카스테라를 두껍게 썰었더니 층이 안 붙어서 애먹었어요. 얇게 써는 게 핵심인 듯', l:9 },
  { u:'다이어터윤', d:'08.10', t:'설탕 반만 넣어도 충분히 달아요', l:4 },
  { u:'하루세끼', d:'08.09', t:'오븐 없는 집에 진짜 반가운 레시피네요', l:7, r:[
      { u:'김셰프의 간단요리', d:'08.09', t:'@하루세끼 감사합니다, 자주 놀러오세요', author:true, l:2 } ] },
  { u:'민트초코', d:'08.07', t:'생크림 휘핑 얼마나 해야 하나요? 뿔이 설 때까지인가요?', l:1 },
  { u:'요리하는아빠', d:'08.05', t:'아이랑 같이 만들기 딱 좋았습니다', l:5 }
];

function card(c, isReply) {
  var t = c.t, m = t.match(/^(@\S+)\s*/);
  if (m) t = '<span class="cmt-mention">' + m[1] + '</span> ' + t.slice(m[0].length);
  return '<div class="cmt' + (isReply ? ' reply' : '') + '">'
    + '<div class="cmt-av">' + c.u.charAt(0) + '</div>'
    + '<div class="cmt-body">'
    +   '<div class="cmt-head"><span class="cmt-name">' + c.u + '</span>'
    +   (c.author ? '<span class="cmt-badge">글쓴이</span>' : '')
    +   '<span class="cmt-date">' + c.d + '</span></div>'
    +   '<p class="cmt-text">' + t + '</p>'
    +   '<div class="cmt-acts">'
    +     '<button class="cmt-act" onclick="like(this)">' + CMT_THUMB + '<i>' + (c.l ? c.l : '') + '</i></button>'
    +     '<button class="cmt-act">' + CMT_REPLY + '답글쓰기</button>'
    +   '</div>'
    + '</div>' + CMT_DOTS + '</div>';
}

function like(btn) {
  var i = btn.querySelector('i'), n = parseInt(i.textContent || '0', 10) || 0;
  var on = btn.classList.toggle('on');
  n = on ? n + 1 : n - 1;
  i.textContent = n > 0 ? n : '';
}

function total() {
  return COMMENTS.reduce(function (a, c) { return a + 1 + (c.r ? c.r.length : 0); }, 0);
}

var sortMode = 'new';
function setSort(m) {
  sortMode = m;
  document.getElementById('sortNew').className = m === 'new' ? 'on' : '';
  document.getElementById('sortHot').className = m === 'hot' ? 'on' : '';
  render();
}

function render() {
  var list = COMMENTS.slice();
  /* 인기순 = 좋아요 내림차순(동수면 최신). 최신순 = 원본 순서(날짜 내림차순으로 작성돼 있음) */
  if (sortMode === 'hot') list.sort(function (a, b) { return (b.l || 0) - (a.l || 0); });

  var html = '';
  list.forEach(function (c, idx) {
    html += card(c, false);
    var rs = c.r || [];
    rs.slice(0, REPLY_MAX_FULL).forEach(function (r) { html += card(r, true); });
    if (rs.length > REPLY_MAX_FULL)
      html += '<div class="cmt-more-reply">답글 ' + (rs.length - REPLY_MAX_FULL) + '개 더보기</div>';
    if (idx < list.length - 1) html += '<div class="c-divider"></div>';
  });
  document.getElementById('cList').innerHTML = html;
  document.getElementById('cTitle').textContent = '댓글 ' + total();
}

render();
</script>

<script src="proto-link.js"></script>
</body>
</html>
