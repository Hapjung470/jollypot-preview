<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>졸리팟 V2 · 고른 상태 색 비교 v1 (난이도·분/시간)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  [hidden]{display:none!important}
  :root{
    --color-primary:#FC642D; --color-secondary:#145F48; --color-surface:#FFF5EA;
    --color-text-primary:#212121; --color-text-secondary:#666666; --color-text-tertiary:#9E9E9E;
    --color-border:#CCCFD4; --color-divider:#E5E7EB; --field:#F5F6F7;
    --proto-bar-bg:#1E1E2E; --proto-active:#5B6ABF; --proto-inactive-bg:#2D2D3D; --proto-inactive-text:#8888A0; --proto-label:#CCCCDD; --proto-divider:#3A3A4E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.3px;background:#ECECEC;color:var(--color-text-primary);padding:16px 0 40px}

  /* ── 프로토타입 컨트롤 (앱 UI 아님) ── */
  .proto-bar{width:390px;max-width:100%;margin:0 auto 14px;background:var(--proto-bar-bg);border-radius:14px;padding:12px 14px;color:var(--proto-label)}
  .proto-bar .lbl{font-size:11.5px;margin-bottom:6px}
  .proto-bar .row{display:flex;gap:6px}
  .proto-bar button{flex:1;border:none;border-radius:8px;padding:9px 0;font-family:inherit;font-size:12.5px;font-weight:600;background:var(--proto-inactive-bg);color:var(--proto-inactive-text);cursor:pointer}
  .proto-bar button.on{background:var(--proto-active);color:#fff}
  .proto-bar .fn{margin-top:10px;padding-top:8px;border-top:1px solid var(--proto-divider);font-size:11px;color:var(--proto-inactive-text)}

  .stage{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:0 8px}
  .col{width:390px;max-width:100%}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;border-radius:6px;padding:4px 10px;margin:0 0 8px 2px}
  .tag.a{background:#6B6B7B} .tag.b{background:#5B6ABF}

  /* ── 앱 화면 ── */
  .phone{width:390px;max-width:100%;height:844px;background:#fff;border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px #D9D9D9}
  .appbar{height:56px;display:flex;align-items:center;padding:0 12px;flex-shrink:0;position:relative}
  .appbar .ttl{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:600;pointer-events:none}
  .appbar .saved{font-size:11px;font-weight:500;color:var(--color-text-secondary);background:#F1F2F4;border-radius:999px;padding:2px 7px;margin-left:5px;vertical-align:2px}
  .appbar svg{width:24px;height:24px}
  .appbar .more{margin-left:auto;font-size:20px;color:var(--color-text-secondary);letter-spacing:0}
  .prog{height:3px;background:var(--color-divider);flex-shrink:0}
  .prog i{display:block;width:40%;height:100%;background:var(--color-primary)}
  .banner{background:var(--color-surface);font-size:13px;color:var(--color-text-secondary);padding:11px 20px;flex-shrink:0}
  .body{flex:1;overflow-y:auto;padding:22px 20px 110px}
  .step{font-size:12.5px;font-weight:700;color:var(--color-primary)}
  .h{font-size:20px;font-weight:600;margin:4px 0 6px}
  .fl{font-size:14px;font-weight:600;margin:22px 0 8px}
  .fl .req{color:var(--color-primary);margin-left:2px}
  .sel{height:48px;border-radius:12px;background:var(--field);display:flex;align-items:center;padding:0 16px;font-size:15px;justify-content:space-between}
  .sel svg{width:18px;height:18px;color:var(--color-text-secondary)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;height:44px;border-radius:12px;font-family:inherit;font-size:15px;letter-spacing:-0.3px;cursor:pointer}
  .row2{display:flex;gap:8px}
  .ipt{height:48px;border-radius:12px;background:var(--field);display:flex;align-items:center;padding:0 16px;font-size:15px;flex:1;justify-content:space-between}
  .ipt .suf{font-size:13px;color:var(--color-text-tertiary)}
  .unit{display:flex;gap:8px}
  .unit button{width:58px;height:48px;border-radius:12px;font-family:inherit;font-size:15px;cursor:pointer}
  .two{display:flex;gap:10px}
  .two > div{flex:1}
  .ta{min-height:84px;border-radius:12px;background:var(--field);padding:13px 16px;font-size:14.5px;line-height:1.55}
  .foot{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 26px;display:flex;gap:10px;border-top:1px solid var(--color-divider)}
  .foot button{height:56px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:-0.3px}
  .foot .prev{flex:1} .foot .next{flex:2.4;border:none;background:var(--color-primary);color:#fff}

  /* 개발사안 — 고른 것 오렌지(테두리형·채움형 두 가지), 안 고른 글자 라이트그레이 */
  .vA .seg button{border:1px solid transparent;background:#F1F2F4;color:var(--color-text-tertiary);font-weight:500}
  .vA .seg button.on{background:#fff;border:1.5px solid var(--color-primary);color:var(--color-primary);font-weight:600}
  .vA .unit button{background:#fff;border:1.5px solid var(--color-primary);color:var(--color-primary);font-weight:600}
  .vA .unit button.on{background:var(--color-primary);color:#fff}
  .vA .foot button{border-radius:12px}
  .vA .foot .prev{border:none;background:#EAEAEA;color:var(--color-text-primary)}

  /* 개선안 — 가이드 v2.0.6 §4.0: 고른 것 딥그린(#6) · 보조 버튼(#2) · 큰 버튼 14px(#1) */
  .vB .seg button,.vB .unit button{border:1px solid transparent;background:#F1F2F4;color:var(--color-text-secondary);font-weight:500}
  .vB .seg button.on,.vB .unit button.on{background:#fff;border:2px solid var(--color-secondary);color:var(--color-secondary);font-weight:600}
  .vB .foot button{border-radius:14px}
  .vB .foot .prev{border:1px solid var(--color-border);background:#fff;color:var(--color-text-primary)}

  /* 비교 메모 (앱 UI 아님) */
  .memo{margin-top:12px;background:#fff;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:#333}
  .memo b{color:#111}
  .memo .cnt{display:inline-block;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:4px;font-size:12.5px}
  .memo .cnt.o{background:#FFE7DD;color:#C2410C} .memo .cnt.g{background:#E3F1EB;color:#145F48}
  .memo ul{margin:6px 0 0 18px}

  @media (max-width:840px){ .stage{gap:22px} }
</style>
</head>
<body>

<div class="proto-bar">
  <div class="lbl">보기</div>
  <div class="row">
    <button data-v="both" class="on">나란히</button>
    <button data-v="A">개발사안</button>
    <button data-v="B">개선안</button>
  </div>
  <div class="fn">jollypot-v2-select-color-compare-v1 · 직접 만들기 STEP 2/5 기본 정보 · 버튼을 눌러 고르는 느낌을 비교해 보세요</div>
</div>

<div class="stage" id="stage"></div>

<template id="screen">
  <div class="phone">
    <div class="appbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div class="ttl">직접 레시피 만들기<span class="saved">저장됨</span></div>
      <span class="more">⋮</span>
    </div>
    <div class="prog"><i></i></div>
    <div class="banner">AI가 먼저 정리했어요 · 함께 채워주세요.</div>
    <div class="body">
      <div class="step">STEP 2 / 5</div>
      <div class="h">기본 정보</div>

      <div class="fl">카테고리<span class="req">*</span></div>
      <div class="sel">디저트 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>

      <div class="fl">난이도<span class="req">*</span></div>
      <div class="seg" data-g="diff"><button>쉬움</button><button class="on">보통</button><button>어려움</button></div>

      <div class="fl">요리 시간<span class="req">*</span></div>
      <div class="row2"><div class="ipt">10</div><div class="unit" data-g="unit"><button class="on">분</button><button>시간</button></div></div>

      <div class="two">
        <div><div class="fl">몇 인분<span class="req">*</span></div><div class="ipt">1 <span class="suf">인분</span></div></div>
        <div><div class="fl">칼로리<span class="req">*</span></div><div class="ipt">450 <span class="suf">kcal</span></div></div>
      </div>

      <div class="fl">레시피 설명<span class="req">*</span></div>
      <div class="ta">노오븐으로 간단하게 만드는 초코 케이크예요. 냉장고에서 굳히기만 하면 완성!</div>
    </div>
    <div class="foot"><button class="prev">이전</button><button class="next">다음</button></div>
  </div>
</template>

<script>
const MEMO = {
  A: `<b>개발사안</b> — 고른 것도 오렌지 <span class="cnt o">오렌지 6곳</span> <small style="color:#888">(필수 * 표시 제외)</small>
      <ul>
        <li>진행 막대 · STEP · <b>보통(테두리)</b> · <b>분(채움)</b> · <b>시간(테두리)</b> · 다음</li>
        <li>고른 표시가 <b>두 모양</b>: 난이도는 테두리, 분/시간은 채움 — 안 고른 「시간」까지 오렌지 테두리라 무엇을 골랐는지 한 번 더 봐야 함</li>
        <li>안 고른 난이도 글자가 라이트그레이 — 가이드상 <b>비활성 전용</b> 색이라 못 누르는 버튼처럼 보임</li>
        <li>「다음」과 「고른 것」이 같은 색 → 눌러야 할 곳이 덜 튐</li>
      </ul>`,
  B: `<b>개선안</b> — 가이드 v2.0.6 §4.0 적용 <span class="cnt o">오렌지 3곳</span><span class="cnt g">딥그린 2곳</span> <small style="color:#888">(필수 * 표시 제외)</small>
      <ul>
        <li>오렌지는 <b>진행 막대 · STEP · 다음</b>만 — 「다음」이 화면에서 유일하게 누를 곳으로 보임</li>
        <li>고른 것은 <b>흰 바탕 + 딥그린 테두리 + 딥그린 글자</b> 한 모양(난이도·분/시간 공통, §4.0 #6)</li>
        <li>안 고른 글자는 미드그레이 #666 — 누를 수 있는 버튼으로 보임</li>
        <li>「이전」은 보조 버튼(흰 바탕 + 회색 테두리, #2) · 아래 큰 버튼 둥글기 14px(#1)</li>
      </ul>`
};
const stage = document.getElementById('stage'), tpl = document.getElementById('screen');
function col(v){
  const c = document.createElement('div'); c.className = 'col v' + v; c.dataset.v = v;
  c.innerHTML = `<span class="tag ${v==='A'?'a':'b'}">${v==='A'?'개발사안':'개선안'}</span>`;
  c.appendChild(tpl.content.cloneNode(true));
  const m = document.createElement('div'); m.className = 'memo'; m.innerHTML = MEMO[v]; c.appendChild(m);
  return c;
}
stage.appendChild(col('A')); stage.appendChild(col('B'));
// 하나만 고르는 버튼 묶음: 누르면 그 묶음에서 하나만 켜짐
stage.addEventListener('click', e => {
  const b = e.target.closest('.seg button, .unit button'); if (!b) return;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('.proto-bar button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.proto-bar button').forEach(x => x.classList.toggle('on', x === btn));
  const v = btn.dataset.v;
  document.querySelectorAll('.col').forEach(c => c.hidden = !(v === 'both' || c.dataset.v === v));
}));
// 폰처럼 좁은 화면에서는 한 안씩 보는 게 비교하기 쉬움
if (window.innerWidth < 840) document.querySelector('.proto-bar button[data-v="A"]').click();
</script>
</body>
</html>
